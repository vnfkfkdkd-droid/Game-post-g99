name: Build d7n HelioBoost G99 APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build d7n KernelSU APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: npm install --legacy-peer-deps
      - run: npm run build
      - run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
      - working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk d7n-HelioBoost-G99-KernelSU.apk
      - uses: actions/upload-artifact@v4
        with:
          name: d7n-HelioBoost-G99-KernelSU-APK
          path: d7n-HelioBoost-G99-KernelSU.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: d7n-v2.0.${{ github.run_number }}
          name: d7n HelioBoost G99 KernelSU v2.0.${{ github.run_number }}
          files: d7n-HelioBoost-G99-KernelSU.apk
